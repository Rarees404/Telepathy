<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telepathy — Encrypted Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#07070f;
            --card:rgba(255,255,255,0.04);
            --card-border:rgba(255,255,255,0.08);
            --cyan:#00e5ff;
            --purple:#a855f7;
            --magenta:#ec4899;
            --text:#e2e8f0;
            --text-dim:#64748b;
            --glow:0 0 60px rgba(0,229,255,0.15);
        }
        body{
            font-family:'Inter',system-ui,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            position:relative;
        }
        /* ── Animated gradient orbs ── */
        .orb{
            position:fixed;
            border-radius:50%;
            filter:blur(80px);
            opacity:0.4;
            pointer-events:none;
            animation:float 20s ease-in-out infinite;
        }
        .orb-1{width:500px;height:500px;background:var(--cyan);top:-10%;left:-10%;animation-delay:0s;}
        .orb-2{width:600px;height:600px;background:var(--purple);bottom:-15%;right:-10%;animation-delay:-7s;}
        .orb-3{width:350px;height:350px;background:var(--magenta);top:50%;left:60%;animation-delay:-14s;}
        @keyframes float{
            0%,100%{transform:translate(0,0) scale(1)}
            25%{transform:translate(30px,-40px) scale(1.05)}
            50%{transform:translate(-20px,30px) scale(0.95)}
            75%{transform:translate(40px,20px) scale(1.02)}
        }
        /* ── Particle field ── */
        .particles{position:fixed;inset:0;pointer-events:none;z-index:0;}
        .particle{
            position:absolute;
            width:2px;height:2px;
            background:var(--cyan);
            border-radius:50%;
            opacity:0;
            animation:particle-rise linear infinite;
        }
        @keyframes particle-rise{
            0%{opacity:0;transform:translateY(100vh) scale(0)}
            10%{opacity:0.6}
            90%{opacity:0.6}
            100%{opacity:0;transform:translateY(-10vh) scale(1)}
        }
        /* ── Hero card ── */
        .hero{
            position:relative;
            z-index:1;
            text-align:center;
            max-width:560px;
            padding:3rem;
            background:var(--card);
            border:1px solid var(--card-border);
            border-radius:24px;
            backdrop-filter:blur(40px);
            -webkit-backdrop-filter:blur(40px);
            box-shadow:var(--glow);
            animation:card-in 1s cubic-bezier(.16,1,.3,1) forwards;
            opacity:0;
        }
        @keyframes card-in{
            from{opacity:0;transform:translateY(40px) scale(0.96)}
            to{opacity:1;transform:translateY(0) scale(1)}
        }
        .lock-icon{
            width:80px;height:80px;
            margin:0 auto 1.5rem;
            background:linear-gradient(135deg,var(--cyan),var(--purple));
            border-radius:20px;
            display:flex;align-items:center;justify-content:center;
            font-size:2rem;
            animation:pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow{
            0%,100%{box-shadow:0 0 20px rgba(0,229,255,0.3)}
            50%{box-shadow:0 0 40px rgba(0,229,255,0.6),0 0 80px rgba(168,85,247,0.2)}
        }
        h1{
            font-size:2.8rem;
            font-weight:800;
            background:linear-gradient(135deg,var(--cyan),var(--purple));
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            margin-bottom:0.75rem;
            letter-spacing:-0.02em;
        }
        .subtitle{
            font-size:1.15rem;
            color:var(--text-dim);
            line-height:1.6;
            margin-bottom:2rem;
            font-weight:400;
        }
        .features{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:0.75rem;
            margin-bottom:2rem;
            text-align:left;
        }
        .feature{
            display:flex;
            align-items:center;
            gap:0.5rem;
            font-size:0.85rem;
            color:var(--text-dim);
            padding:0.5rem 0.75rem;
            background:rgba(255,255,255,0.03);
            border-radius:8px;
            border:1px solid rgba(255,255,255,0.05);
        }
        .feature-dot{
            width:6px;height:6px;
            border-radius:50%;
            background:var(--cyan);
            flex-shrink:0;
        }
        .cta{
            display:inline-flex;
            align-items:center;
            gap:0.75rem;
            padding:1rem 2.5rem;
            font-size:1rem;
            font-weight:600;
            color:#000;
            background:linear-gradient(135deg,var(--cyan),#06b6d4);
            border:none;
            border-radius:14px;
            cursor:pointer;
            text-decoration:none;
            transition:all 0.3s cubic-bezier(.16,1,.3,1);
            box-shadow:0 0 20px rgba(0,229,255,0.3);
            letter-spacing:0.01em;
        }
        .cta:hover{
            transform:translateY(-2px) scale(1.03);
            box-shadow:0 0 40px rgba(0,229,255,0.5);
        }
        .cta svg{width:18px;height:18px;transition:transform 0.3s}
        .cta:hover svg{transform:translateX(4px)}
        .footer{
            position:fixed;
            bottom:1.5rem;
            font-size:0.8rem;
            color:var(--text-dim);
            opacity:0.5;
            z-index:1;
        }
        @media(max-width:600px){
            .hero{margin:1rem;padding:2rem 1.5rem}
            h1{font-size:2rem}
            .features{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <!-- Background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Hero -->
    <div class="hero">
        <div class="lock-icon">🔐</div>
        <h1>Telepathy</h1>
        <p class="subtitle">Anonymous, end-to-end encrypted messaging. Your private keys never leave your device.</p>
        <div class="features">
            <div class="feature"><span class="feature-dot"></span>RSA-2048 + AES-256</div>
            <div class="feature"><span class="feature-dot"></span>Digital signatures</div>
            <div class="feature"><span class="feature-dot"></span>Zero server plaintext</div>
            <div class="feature"><span class="feature-dot"></span>Ephemeral history</div>
        </div>
        <a href="/chat/" class="cta">
            Enter Secure Chat
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </a>
    </div>

    <div class="footer">&copy; 2025 Telepathy &mdash; End-to-End Encrypted</div>

    <script>
        // Generate CSS-only particles
        const container = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = (Math.random() * 15) + 's';
            p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
            container.appendChild(p);
        }
    </script>
</body>
</html>
